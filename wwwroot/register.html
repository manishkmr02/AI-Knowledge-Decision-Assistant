<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account · Knowledge Assistant</title>
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body class="auth-page">
    <a href="/" class="brand auth-brand">📚 Knowledge<span>Assistant</span></a>

    <main class="auth-card">
        <h1>Create your account</h1>
        <p class="auth-sub">Start with your organization — you can add documents right after.</p>

        <form id="registerForm" novalidate>
            <label>
                Organization name
                <input type="text" id="orgName" placeholder="Name of Organization" required />
            </label>
            <label>
                Work email
                <input type="email" id="email" placeholder="abc@gmail.com" required />
            </label>
            <label>
                Password
                <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required />
            </label>

            <div class="form-error" id="err" hidden></div>
            <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
    </main>

    <script>
    const form = document.getElementById('registerForm');
    const err = document.getElementById('err');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Creating…';

      const body = {
        organizationName: document.getElementById('orgName').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Registration failed.');
        }
        window.location.href = '/dashboard.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });
    </script>
</body>
</html>
