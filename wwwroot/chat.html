<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistant</title>
    <link rel="stylesheet" href="/css/site.css" />
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            background: var(--surface)
        }

        .chat-shell {
            display: flex;
            flex-direction: column;
            height: 100vh
        }

        .chat-top {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2)
        }

            .chat-top .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--ok)
            }

            .chat-top strong {
                font-size: .95rem
            }

            .chat-top small {
                color: var(--muted);
                font-size: .78rem
            }

        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: .92rem;
            line-height: 1.45
        }

            .bubble.user {
                align-self: flex-end;
                background: linear-gradient(135deg,var(--accent),var(--accent-2));
                color: #fff
            }

            .bubble.bot {
                align-self: flex-start;
                background: var(--surface-2);
                border: 1px solid var(--border)
            }

            .bubble .sources {
                margin-top: 8px;
                display: flex;
                flex-direction: column;
                gap: 4px;
                font-size: .76rem;
                color: var(--accent)
            }

                .bubble .sources span {
                    background: rgba(109,140,255,.12);
                    padding: 3px 8px;
                    border-radius: 6px;
                    display: inline-block
                }

        .chat-input {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--surface-2)
        }

            .chat-input input {
                flex: 1;
                padding: 11px 14px;
                border-radius: 10px;
                background: var(--bg);
                border: 1px solid var(--border);
                color: var(--text);
                font-size: .92rem
            }

                .chat-input input:focus {
                    outline: none;
                    border-color: var(--accent)
                }

            .chat-input button {
                padding: 11px 18px;
                border: none;
                border-radius: 10px;
                background: linear-gradient(135deg,var(--accent),var(--accent-2));
                color: #fff;
                font-weight: 600;
                cursor: pointer
            }

                .chat-input button:disabled {
                    opacity: .5;
                    cursor: not-allowed
                }

        .center-msg {
            text-align: center;
            color: var(--muted);
            margin: auto;
            padding: 24px;
            font-size: .9rem
        }

        .err-msg {
            text-align: center;
            color: #ffb4b4;
            margin: auto;
            padding: 24px;
            font-size: .9rem
        }
    </style>
</head>
<body>
    <div class="chat-shell" id="shell">
        <div class="center-msg">Loading assistant…</div>
    </div>

    <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('t') || '';
    const shell = document.getElementById('shell');
    let orgName = '';
    let busy = false;

    async function boot() {
      if (!token) { showError('Missing assistant token in URL.'); return; }

      try {
        const res = await fetch(`/api/assistant/info?token=${encodeURIComponent(token)}`);
        if (!res.ok) { showError('This assistant link is invalid or has been removed.'); return; }
        const data = await res.json();
        orgName = data.organizationName;
        renderChat();
      } catch {
        showError('Could not reach the assistant. Please try again later.');
      }
    }

    function showError(msg) {
      shell.innerHTML = `<div class="err-msg">${msg}</div>`;
    }

    function renderChat() {
      shell.innerHTML = `
        <div class="chat-top">
          <span class="dot"></span>
          <div>
            <strong>${escapeHtml(orgName)} Assistant</strong><br>
            <small>Answers grounded in uploaded documents</small>
          </div>
        </div>
        <div class="chat-scroll" id="scroll"></div>
        <form class="chat-input" id="form">
          <input id="q" placeholder="Ask a question…" autocomplete="off" required />
          <button type="submit" id="send">Send</button>
        </form>
      `;
      document.getElementById('form').addEventListener('submit', onSubmit);
      addBot(`Hi! I'm the ${escapeHtml(orgName)} assistant. Ask me anything about our documents.`);
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function addUser(text) {
      const scroll = document.getElementById('scroll');
      const el = document.createElement('div');
      el.className = 'bubble user';
      el.textContent = text;
      scroll.appendChild(el);
      scroll.scrollTop = scroll.scrollHeight;
    }

    function addBot(text, sources = []) {
      const scroll = document.getElementById('scroll');
      const el = document.createElement('div');
      el.className = 'bubble bot';
      el.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
      if (sources.length) {
        const src = document.createElement('div');
        src.className = 'sources';
        src.innerHTML = sources.map(s => `<span>📄 ${escapeHtml(s)}</span>`).join('');
        el.appendChild(src);
      }
      scroll.appendChild(el);
      scroll.scrollTop = scroll.scrollHeight;
    }

    async function onSubmit(e) {
      e.preventDefault();
      if (busy) return;
      const input = document.getElementById('q');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addUser(text);

      busy = true;
      document.getElementById('send').disabled = true;
      addBot('Thinking…');

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ assistantToken: token, question: text })
        });
        const data = await res.json().catch(() => ({}));

        // Remove "Thinking…" bubble
        const scroll = document.getElementById('scroll');
        scroll.removeChild(scroll.lastChild);

        if (!res.ok) {
          addBot(data.error || 'Something went wrong. Please try again.');
        } else {
          const sources = (data.references || []).map(r =>
            `${r.fileName} — Page ${r.pageNumber}`);
          addBot(data.answer, sources);
        }
      } catch {
        addBot('Network error. Please try again.');
      } finally {
        busy = false;
        document.getElementById('send').disabled = false;
        input.focus();
      }
    }

    boot();
    </script>
</body>
</html>
