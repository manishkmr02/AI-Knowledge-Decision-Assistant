<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in · Knowledge Assistant</title>
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body class="auth-page">
    <a href="/" class="brand auth-brand">📚 Knowledge<span>Assistant</span></a>

    <main class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-sub">Log in to manage your knowledge base.</p>

        <form id="loginForm" novalidate>
            <label>
                Email
                <input type="email" id="email" required />
            </label>
            <label>
                Password
                <input type="password" id="password" required />
            </label>

            <div class="form-error" id="err" hidden></div>
            <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Log in</button>
        </form>

        <p class="auth-switch">New here? <a href="/register.html">Create an account</a></p>
    </main>

    <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('err');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Logging in…';

      const body = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Login failed.');
        }
        window.location.href = '/dashboard.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });
    </script>
</body>
</html>
